<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Capture | Flask</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f4f6f8;
        color: #17202a;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(34rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #d8dee6;
        border-radius: 0.75rem;
        background: white;
        box-shadow: 0 0.75rem 2rem #17202a12;
      }
      form { display: flex; gap: 0.75rem; }
      input {
        min-width: 0;
        flex: 1;
        padding: 0.75rem;
        border: 1px solid #aab5c2;
        border-radius: 0.4rem;
        font: inherit;
      }
      button {
        padding: 0.75rem 1.1rem;
        border: 0;
        border-radius: 0.4rem;
        background: #1769e8;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }
      output { display: block; margin-top: 1.25rem; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Enter some text</h1>
      <form method="post">
        <input name="user_text" type="text" placeholder="Type a question..." value="{{ captured_text or '' }}" required>
        <button type="submit">Go</button>
      </form>
      {% if captured_text is not none %}
        <output aria-live="polite"><strong>Python captured:</strong> {{ captured_text }}</output>
      {% endif %}
      {% if llm_response %}
        <output aria-live="polite"><strong>Groq replied:</strong> {{ llm_response }}</output>
      {% endif %}
      {% if error_message %}
        <output aria-live="polite"><strong>Error:</strong> {{ error_message }}</output>
      {% endif %}
    </main>
  </body>
</html>
